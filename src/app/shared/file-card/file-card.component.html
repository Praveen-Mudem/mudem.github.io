<div class="card h-100">
  <div class="card-img-top">
    <!-- Image files -->
    <img *ngIf="isImageFile(document.FileType)" class="img-fluid" [src]="document.Filepath || 'assets/images/file.png'"
      alt="Document Image">

    <!-- Video files -->
    <video *ngIf="isVideoFile(document.FileType)" controls preload="metadata" [src]="document.Filepath">
      Your browser does not support the video tag.
    </video>

    <!-- PDF files -->
    <i *ngIf="isPdfFile(document.FileType)" class="bi bi-file-earmark-pdf"></i>

    <!-- Other file types -->
    <i *ngIf="!isImageFile(document.FileType) && !isVideoFile(document.FileType) && !isPdfFile(document.FileType)"
      class="bi bi-file-earmark"></i>
  </div>

  <div class="card-footer">
    <button class="btn btn-primary btn-sm me-2" (click)="openModal()">
      <i class="bi bi-eye"></i> View
    </button>
    <button class="btn btn-danger btn-sm" (click)="onDelete()">
      <i class="bi bi-trash"></i> Delete
    </button>
  </div>
</div>

<!-- Bootstrap Modal -->
<div class="modal fade show" tabindex="-1" [ngStyle]="{display: showModal ? 'block' : 'none', background: 'rgba(0,0,0,0.4)'}" *ngIf="showModal" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"></h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <ng-container *ngIf="isImageFile(document.FileType)">
          <img [src]="document.Filepath || 'assets/images/file.png'" [alt]="document.FileName" style="max-width: 100%; max-height: 70vh; object-fit: contain; display: block; margin: auto;" />
        </ng-container>
        <ng-container *ngIf="isVideoFile(document.FileType)">
          <video controls preload="metadata" [src]="document.Filepath" style="max-width: 100%; max-height: 70vh; object-fit: contain; display: block; margin: auto;"></video>
        </ng-container>
        <ng-container *ngIf="isPdfFile(document.FileType)">
          <iframe [src]="document.Filepath | safeUrl" width="100%" height="500px" style="min-height:60vh;"></iframe>
        </ng-container>
        <ng-container *ngIf="!isImageFile(document.FileType) && !isVideoFile(document.FileType) && !isPdfFile(document.FileType)">
          <p>Preview not available for this file type.</p>
        </ng-container>
      </div>
    </div>
  </div>
</div>
