<div class="container d-flex justify-content-center py-4">
  <div class="forgot-password-container bg-light p-4 rounded shadow-sm" style="max-width: 400px; width: 100%;">
    <h4 class="text-center mb-4 fw-semibold">Forgot Password</h4>
    <ng-container *ngIf="!showResetForm">
      <p class="text-muted small text-center mb-4">Enter your email address and we'll send you a reset link to reset your password.</p>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSendForgotPassword()">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            class="form-control rounded-2" 
            id="email" 
            formControlName="email"
            placeholder="Enter your email address"
            [class.is-invalid]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
          <div class="invalid-feedback" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email is required</small>
            <small *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Please enter a valid email</small>
          </div>
        </div>
        <button 
          type="submit" 
          class="btn btn-primary w-100 rounded-2 py-2 fw-semibold mb-3"
          [disabled]="isLoading || forgotPasswordForm.invalid">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Send Reset Link
        </button>
      </form>
      <div class="text-center">
        <button type="button" class="btn btn-link text-decoration-none" (click)="goToLogin()">
          Back to Login
        </button>
      </div>
    </ng-container>
    <ng-container *ngIf="showResetForm">
      <p class="text-muted small text-center mb-4">Enter your new password below.</p>
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onResetPassword()">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input 
            type="password" 
            class="form-control rounded-2" 
            id="newPassword" 
            formControlName="newPassword"
            placeholder="Enter new password"
            [class.is-invalid]="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
          <div class="invalid-feedback" *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
            <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">Password is required</small>
            <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 8 characters</small>
          </div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input 
            type="password" 
            class="form-control rounded-2" 
            id="confirmPassword" 
            formControlName="confirmPassword"
            placeholder="Confirm new password"
            [class.is-invalid]="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched || resetPasswordForm.errors?.['mismatch']">
          <div class="invalid-feedback" *ngIf="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched">
            <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">Confirm password is required</small>
          </div>
          <div class="invalid-feedback" *ngIf="resetPasswordForm.errors?.['mismatch']">
            <small>Passwords do not match</small>
          </div>
        </div>
        <button 
          type="submit" 
          class="btn btn-success w-100 rounded-2 py-2 fw-semibold mb-3"
          [disabled]="isLoading || resetPasswordForm.invalid || resetPasswordForm.errors?.['mismatch']">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Reset Password
        </button>
      </form>
      <div class="text-center">
        <button type="button" class="btn btn-link text-decoration-none" (click)="goToLogin()">
          Back to Login
        </button>
      </div>
    </ng-container>
  </div>
</div>
