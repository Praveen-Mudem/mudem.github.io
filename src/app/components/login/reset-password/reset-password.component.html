<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      
      <h4 class="card-title text-center mb-3">Reset Password</h4>
      <p class="text-muted text-center mb-4">Enter your current password and choose a new password.</p>
      
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onResetPassword()">
        <!-- Current Password -->
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Current Password</label>
          <input 
            type="password" 
            class="form-control" 
            id="currentPassword" 
            formControlName="currentPassword"
            placeholder="Enter current password"
            [class.is-invalid]="resetPasswordForm.get('currentPassword')?.invalid && resetPasswordForm.get('currentPassword')?.touched">
          <div class="invalid-feedback" *ngIf="resetPasswordForm.get('currentPassword')?.invalid && resetPasswordForm.get('currentPassword')?.touched">
            Current password is required
          </div>
        </div>
        
        <!-- New Password -->
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input 
            type="password" 
            class="form-control" 
            id="newPassword" 
            formControlName="newPassword"
            placeholder="Enter new password"
            [class.is-invalid]="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
          <div class="invalid-feedback" *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched">
            <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">New password is required</small>
            <small *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 8 characters</small>
          </div>
        </div>
        
        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input 
            type="password" 
            class="form-control" 
            id="confirmPassword" 
            formControlName="confirmPassword"
            placeholder="Confirm new password"
            [class.is-invalid]="(resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched) || resetPasswordForm.errors?.['passwordMismatch']">
          <div class="invalid-feedback" *ngIf="(resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched) || resetPasswordForm.errors?.['passwordMismatch']">
            <small *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">Please confirm your new password</small>
            <small *ngIf="resetPasswordForm.errors?.['passwordMismatch']">Passwords do not match</small>
          </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="d-grid gap-2 d-md-flex">
          <button 
            type="submit" 
            class="btn btn-success flex-md-fill"
            [disabled]="isLoading || resetPasswordForm.invalid">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Reset Password
          </button>
          
          <button 
            type="button" 
            class="btn btn-outline-secondary flex-md-fill"
            (click)="onCancel()"
            [disabled]="isLoading">
            Cancel
          </button>
        </div>
      </form>           
    </div>
  </div>
</div>
