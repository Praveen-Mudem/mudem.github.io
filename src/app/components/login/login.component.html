<div class="container d-flex justify-content-around pb-4">
    <div class="login-container bg-light p-4 rounded shadow-sm">
        
        <!-- Login Form -->
        <div>
            <h4 class="text-center mb-4 fw-semibold">Login</h4>
            <form (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control rounded-2" id="email" [(ngModel)]="email" name="email" placeholder="Enter email" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control rounded-2" id="password" [(ngModel)]="password" name="password" placeholder="Password" required />
                </div>            
                <div class="text-center">
                    <button type="submit" class="btn btn-primary w-100 rounded-2 py-2 fw-semibold">Login</button>
                </div>
                <div class="text-danger mt-2" *ngIf="errorMsg">{{errorMsg}}</div>
            </form>
            <div class="mt-3 text-center">
                <a routerLink="/forgotPassword" class="text-decoration-none">Forgot password?</a>
            </div>
        </div>
    </div>
</div>
