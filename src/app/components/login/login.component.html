<div class="container d-flex justify-content-around mt-5">
    <div class="login-container">
        <h2 class="text-center mb-4">Login</h2>
        <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" placeholder="Enter email" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" placeholder="Password" required />
            </div>            
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
            <div class="text-danger mt-2" *ngIf="errorMsg">{{errorMsg}}</div>
        </form>
        <div class="mt-3 text-end">
            <a href="#">Forgot password?</a>
        </div>
    </div>
</div>
