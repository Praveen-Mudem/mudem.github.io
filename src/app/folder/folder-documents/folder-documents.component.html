<div class="container top-content-section overflow-hidden">
  <!-- Back Button -->
  <div class="d-flex align-items-center mb-3">
    <button class="btn btn-outline-secondary me-3" (click)="goBack()">
      <i class="bi bi-arrow-left me-2"></i>
      Back to Folders
    </button>
    <h4 class="mb-0 text-muted">Documents</h4>
  </div>
  
  <div class="row mt-4">
    <!-- Add File Card -->
    <div class="col-12 col-lg-3 col-md-4 col-sm-6 pb-4">
      <div class="card h-100 d-flex flex-column justify-content-center align-items-center position-relative add-file-card">
        <label for="fileInput" class="btn btn-outline-primary mb-0 cursor-pointer">
          <i class="bi bi-plus-circle" style="font-size: 2rem;"></i><br />
          Add Files
        </label>
        <input id="fileInput" type="file" (change)="onFileSelected($event)" accept=".mp4,.pdf,.jpg,.jpeg,.png" multiple hidden />
        <div *ngIf="selectedFiles && selectedFiles.length" class="mt-2 w-100 px-2">
         <div class="small text-center" *ngFor="let file of selectedFiles.slice(0,2); let i = index">
            {{ file.name }}<span *ngIf="i === 1 && selectedFiles.length > 2"> ...</span>
          </div>
        </div>
        <button class="btn btn-success upload-btn" (click)="uploadFiles()" [disabled]="!selectedFiles || !selectedFiles.length || progress > 0 || isLoading">
          Upload
        </button>
        <div *ngIf="progress > 0" class="mt-2 w-100 px-2">
          <div class="progress">
            <div class="progress-bar" role="progressbar" [style.width]="progress + '%'" [attr.aria-valuenow]="progress" aria-valuemin="0" aria-valuemax="100">{{progress}}%</div>
          </div>
        </div>
        <div *ngIf="errorMsg" class="alert alert-danger mt-2">
          {{ errorMsg }}
        </div>
      </div>
    </div>
    
    <!-- Document Cards -->
    <div class="col-12 col-lg-3 col-md-4 col-sm-6 pb-4" *ngFor="let doc of documents">
      <!-- <app-file-card [document]="doc" (delete)="deleteDocument($event)"></app-file-card> -->
    </div>
  </div>
</div>
