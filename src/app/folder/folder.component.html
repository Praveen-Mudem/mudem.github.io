<div class="container top-content-section overflow-hiden">
  <div *ngIf="loading" class="text-center py-5">
    <span>Loading folders...</span>
  </div>
  <div *ngIf="errorMsg" class="alert alert-danger text-center">
    {{ errorMsg }}
  </div>
  <div class="row mt-4" *ngIf="!loading && !errorMsg">
    <div class="col-12 col-lg-3 col-md-4 col-sm-6 col-xs-12 pb-4">
      <div class="card h-100 d-flex flex-column justify-content-center align-items-center"
        style="min-height: 250px; border: 2px dashed #007bff; background: #f8f9fa;">
        <button class="btn btn-outline-primary" (click)="onAddFolder()">
          <i class="bi bi-plus-circle" style="font-size: 2rem;"></i><br />
          Add New Folder
        </button>
      </div>
    </div>
    <div class="col-12 col-lg-3 col-md-4 col-sm-6 col-xs-12 pb-4" *ngFor="let folder of folderList">
      <div class="card">
        <div class="card-img-top text-center p-2">
          <img class="profile-pic img-fluid" src="assets/images/folder_close.png" alt="Profile Image">
        </div>
        <div class="card-body text-center">
          <h5 class="card-title">{{ folder.Name }}</h5>
          <!-- Show shared badge if folder is shared -->
          <div *ngIf="folder.ShareUrl && folder.UniqueId" class="mt-2">
            <div class="badge bg-success mb-2">Shared</div>
          </div>
        </div>
        <div class="card-footer text-end p-2">
          <!-- Show Share button only if folder is not shared -->
          <a *ngIf="!folder.ShareUrl || !folder.UniqueId" class="btn btn-sm btn-primary me-2" 
             (click)="onShareFolder(folder); $event.stopPropagation()">Share</a>
          
          <!-- Show View Share Info button if folder is already shared -->
          <a *ngIf="folder.ShareUrl && folder.UniqueId" class="btn btn-sm btn-info me-2" 
             (click)="viewShareInfo(folder); $event.stopPropagation()">View Share Info</a>
          
          <!-- Show Remove Share button if folder is already shared -->
          <a *ngIf="folder.ShareUrl && folder.UniqueId" class="btn btn-sm btn-warning me-2" 
             (click)="removeShare(folder.FolderId); $event.stopPropagation()">Remove Share</a>
          
          <a class="btn btn-sm btn-primary me-2" (click)="onEditFolder(folder); $event.stopPropagation()">Edit</a>
          <a class="btn btn-sm btn-danger" (click)="onDeleteFolder(folder.FolderId); $event.stopPropagation()">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Share Folder Modal -->
<ng-template #shareModal>
  <div class="modal-header">
    <h4 class="modal-title">Share Folder</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeShareModal()">    
    </button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label for="folderName" class="form-label">Folder Name</label>
      <input type="text" class="form-control" id="folderName" [(ngModel)]="shareData.name" readonly>
    </div>
    <div class="mb-3">
      <label for="folderDescription" class="form-label">Description</label>
      <textarea class="form-control" id="folderDescription" rows="3" [(ngModel)]="shareData.description"></textarea>
    </div>
    <div class="mb-3">
      <label for="sharePassword" class="form-label">Password <span class="text-danger">*</span></label>
      <input type="password" class="form-control" id="sharePassword" [(ngModel)]="shareData.password" 
             placeholder="Enter password to share folder" required>
      <div class="form-text">This password will be required to access the shared folder.</div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeShareModal()">Cancel</button>
    <button type="button" class="btn btn-primary" 
            [disabled]="!shareData.password || shareData.password.trim() === '' || shareData.password.trim().length < 4" 
            (click)="confirmShare()">Share Folder</button>
  </div>
</ng-template>

<!-- View Share Info Modal -->
<ng-template #viewShareModal>
  <div class="modal-header">
    <h4 class="modal-title">Folder Share Information</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeViewShareModal()">
    </button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label for="viewFolderName" class="form-label">Folder Name</label>
      <input type="text" class="form-control" id="viewFolderName" [value]="viewShareData.name" readonly>
    </div>
    <div class="mb-3">
      <label for="viewFolderDescription" class="form-label">Description</label>
      <textarea class="form-control" id="viewFolderDescription" rows="3" [value]="viewShareData.description" readonly></textarea>
    </div>
    <div class="mb-3">
      <label for="viewShareLink" class="form-label">Share Link</label>
      <div class="input-group">
        <input type="text" class="form-control" id="viewShareLink" [value]="viewShareData.shareUrl" readonly>
        <button class="btn btn-outline-secondary" type="button" (click)="copyToClipboard(viewShareData.shareUrl)">
          <i class="bi bi-clipboard"></i> Copy
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="viewPassword" class="form-label">Password</label>
      <div class="input-group">
        <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="viewPassword" [value]="viewShareData.password" readonly>
        <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
          <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="copyToClipboard(viewShareData.password)">
          <i class="bi bi-clipboard"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeViewShareModal()">Close</button>
  </div>
</ng-template>
