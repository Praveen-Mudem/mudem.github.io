<div class="container top-content-section overflow-hidden p-4">
  <!-- Loading State (using your existing preloader) -->
  <div *ngIf="loading" class="text-center py-5">
    <span class="h5 text-muted">Loading folders...</span>
  </div>
  
  <!-- Error State -->
  <div *ngIf="errorMsg" class="alert alert-danger">
    {{ errorMsg }}
  </div>
  
  <!-- Folders Grid -->
  <div *ngIf="!loading && !errorMsg" class="row">
    <!-- Add New Folder Card -->
    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6 col-12 mb-4">
      <div class="add-folder-card d-flex flex-column align-items-center justify-content-center h-100" (click)="onAddFolder()">
        <div class="add-folder-content text-center">
          <i class="bi bi-plus-circle add-icon mb-3"></i>
          <div class="add-text">Add New Folder</div>
        </div>
      </div>
    </div>
    
    <!-- Folder Cards -->
    <div *ngFor="let folder of folderList" class="col-xl-3 col-lg-4 col-md-6 col-sm-6 col-12 mb-4">
      <div class="folder-card h-100" (click)="onFolderCardClick(folder)">
        <div class="folder-header p-4 text-center position-relative">
          <div class="folder-icon mx-auto mb-3 d-flex align-items-center justify-content-center">
            <img src="assets/images/folder_close.png" alt="Folder">
          </div>
          <div *ngIf="folder.ShareUrl && folder.UniqueId" class="shared-badge badge text-white">
            Shared
          </div>
        </div>
        
        <div class="folder-body p-3">
          <h5 class="folder-name text-center mb-0">{{ folder.Name }}</h5>
        </div>
        
        <div class="folder-actions p-3 d-flex gap-2 flex-wrap mt-auto" (click)="$event.stopPropagation()">
          <!-- Share button only if folder is not shared -->
          <button *ngIf="!folder.ShareUrl || !folder.UniqueId" 
                  class="btn action-btn btn-primary btn-sm flex-fill" 
                  (click)="onShareFolder(folder)">
            <i class="bi bi-share me-1"></i>
            Share
          </button>
          
          <!-- View Share Info button if folder is already shared -->
          <button *ngIf="folder.ShareUrl && folder.UniqueId" 
                  class="btn action-btn btn-info btn-sm flex-fill" 
                  (click)="viewShareInfo(folder)">
            <i class="bi bi-info-circle me-1"></i>
            Info
          </button>
          
          <!-- Remove Share button if folder is already shared -->
          <button *ngIf="folder.ShareUrl && folder.UniqueId" 
                  class="btn action-btn btn-warning btn-sm flex-fill" 
                  (click)="removeShare(folder.FolderId)">
            <i class="bi bi-x-circle me-1"></i>
            Unshare
          </button>
          
          <button class="btn action-btn btn-primary btn-sm flex-fill" (click)="onEditFolder(folder)">
            <i class="bi bi-pencil me-1"></i>
            Edit
          </button>
          
          <button class="btn action-btn btn-danger btn-sm flex-fill" (click)="onDeleteFolder(folder.FolderId)">
            <i class="bi bi-trash me-1"></i>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modern Share Folder Modal -->
<ng-template #shareModal>
  <div class="modal-header">
    <h4 class="modal-title">
      <i class="bi bi-share me-2"></i>
      Share Folder
    </h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeShareModal()">    
    </button>
  </div>
  <div class="modal-body">
    <div class="mb-4">
      <label for="folderName" class="form-label">
        <i class="bi bi-folder me-2"></i>
        Folder Name
      </label>
      <input type="text" class="form-control" id="folderName" [(ngModel)]="shareData.name" readonly>
    </div>
    <div class="mb-4">
      <label for="folderDescription" class="form-label">
        <i class="bi bi-file-text me-2"></i>
        Description
      </label>
      <textarea class="form-control" id="folderDescription" rows="3" [(ngModel)]="shareData.description" 
                placeholder="Add a description for your shared folder..."></textarea>
    </div>
    <div class="mb-3">
      <label for="sharePassword" class="form-label">
        <i class="bi bi-shield-lock me-2"></i>
        Password <span class="text-danger">*</span>
      </label>
      <input type="password" class="form-control" id="sharePassword" [(ngModel)]="shareData.password" 
             placeholder="Enter a secure password (minimum 4 characters)" required>
      <div class="form-text">
        <i class="bi bi-info-circle me-1"></i>
        This password will be required to access the shared folder.
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeShareModal()">
      <i class="bi bi-x-lg me-2"></i>
      Cancel
    </button>
    <button type="button" class="btn btn-primary" 
            [disabled]="!shareData.password || shareData.password.trim() === '' || shareData.password.trim().length < 4" 
            (click)="confirmShare()">
      <i class="bi bi-share me-2"></i>
      Share Folder
    </button>
  </div>
</ng-template>

<!-- Modern View Share Info Modal -->
<ng-template #viewShareModal>
  <div class="modal-header">
    <h4 class="modal-title">
      <i class="bi bi-info-circle me-2"></i>
      Folder Share Information
    </h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeViewShareModal()">
    </button>
  </div>
  <div class="modal-body">
    <div class="mb-4">
      <label for="viewFolderName" class="form-label">
        <i class="bi bi-folder me-2"></i>
        Folder Name
      </label>
      <input type="text" class="form-control" id="viewFolderName" [value]="viewShareData.name" readonly>
    </div>
    <div class="mb-4">
      <label for="viewFolderDescription" class="form-label">
        <i class="bi bi-file-text me-2"></i>
        Description
      </label>
      <textarea class="form-control" id="viewFolderDescription" rows="3" [value]="viewShareData.description" readonly></textarea>
    </div>
    <div class="mb-4">
      <label for="viewShareLink" class="form-label">
        <i class="bi bi-link-45deg me-2"></i>
        Share Link
      </label>
      <div class="input-group">
        <input type="text" class="form-control" id="viewShareLink" [value]="viewShareData.shareUrl" readonly>
        <button class="btn btn-outline-secondary" type="button" (click)="copyToClipboard(viewShareData.shareUrl)"
                title="Copy share link">
          <i class="bi bi-clipboard"></i>
        </button>
      </div>
    </div>
    <div class="mb-3">
      <label for="viewPassword" class="form-label">
        <i class="bi bi-shield-lock me-2"></i>
        Password
      </label>
      <div class="input-group">
        <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="viewPassword" [value]="viewShareData.password" readonly>
        <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()"
                [title]="showPassword ? 'Hide password' : 'Show password'">
          <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
        </button>
        <button class="btn btn-outline-secondary" type="button" (click)="copyToClipboard(viewShareData.password)"
                title="Copy password">
          <i class="bi bi-clipboard"></i>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeViewShareModal()">
      <i class="bi bi-x-lg me-2"></i>
      Close
    </button>
  </div>
</ng-template>
