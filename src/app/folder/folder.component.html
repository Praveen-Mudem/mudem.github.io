<div class="container top-content-section overflow-hiden">
  <div *ngIf="loading" class="text-center py-5">
    <span>Loading folders...</span>
  </div>
  <div *ngIf="errorMsg" class="alert alert-danger text-center">
    {{ errorMsg }}
  </div>
  <div class="row mt-4" *ngIf="!loading && !errorMsg">
    <div class="col-12 col-lg-3 col-md-4 col-sm-6 col-xs-12 pb-4">
      <div class="card h-100 d-flex flex-column justify-content-center align-items-center"
        style="min-height: 250px; border: 2px dashed #007bff; background: #f8f9fa;">
        <button class="btn btn-outline-primary" (click)="onAddFolder()">
          <i class="bi bi-plus-circle" style="font-size: 2rem;"></i><br />
          Add New Folder
        </button>
      </div>
    </div>
    <div class="col-12 col-lg-3 col-md-4 col-sm-6 col-xs-12 pb-4" *ngFor="let folder of folderList">
      <div class="card" (click)="onFolderCardClick(folder)" style="cursor:pointer;">
        <div class="card-img-top text-center p-2">
          <img class="profile-pic img-fluid" src="assets/images/folder_close.png" alt="Profile Image">
        </div>
        <div class="card-body text-center">
          <h5 class="card-title">{{ folder.Name }}</h5>
        </div>
        <div class="card-footer text-end p-2">
          <a class="btn btn-sm btn-primary me-2" (click)="onShareFolder(folder); $event.stopPropagation()">Share</a>
          <a class="btn btn-sm btn-primary me-2" (click)="onEditFolder(folder); $event.stopPropagation()">Edit</a>
          <a class="btn btn-sm btn-danger" (click)="onDeleteFolder(folder.FolderId); $event.stopPropagation()">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Share Folder Modal -->
<ng-template #shareModal>
  <div class="modal-header">
    <h4 class="modal-title">Share Folder</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeShareModal()">    
    </button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label for="folderName" class="form-label">Folder Name</label>
      <input type="text" class="form-control" id="folderName" [(ngModel)]="shareData.name" readonly>
    </div>
    <div class="mb-3">
      <label for="folderDescription" class="form-label">Description</label>
      <textarea class="form-control" id="folderDescription" rows="3" [(ngModel)]="shareData.description"></textarea>
    </div>
    <div class="mb-3">
      <label for="sharePassword" class="form-label">Password <span class="text-danger">*</span></label>
      <input type="password" class="form-control" id="sharePassword" [(ngModel)]="shareData.password" 
             placeholder="Enter password to share folder" required>
      <div class="form-text">This password will be required to access the shared folder.</div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeShareModal()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="confirmShare()">Share Folder</button>
  </div>
</ng-template>
