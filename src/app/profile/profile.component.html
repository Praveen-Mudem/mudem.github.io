<div class="container top-content-section overflow-hidden p-4">
  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-5">
    <span class="h5 text-muted">Loading profiles...</span>
  </div>
  
  <!-- Error State -->
  <div *ngIf="errorMsg" class="alert alert-danger">
    {{ errorMsg }}
  </div>
  
  <!-- Profiles Grid -->
  <div *ngIf="!loading && !errorMsg" class="row">
    <!-- Add New Profile Card -->
    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6 col-12 mb-4">
      <div class="add-profile-card d-flex flex-column align-items-center justify-content-center h-100" (click)="onAddProfile()">
        <div class="add-profile-content text-center">
          <i class="bi bi-person-plus add-icon mb-3"></i>
          <div class="add-text">Add New Profile</div>
        </div>
      </div>
    </div>
    
    <!-- Profile Cards -->
    <div *ngFor="let profile of profileList" class="col-xl-3 col-lg-4 col-md-6 col-sm-6 col-12 mb-4">
      <div class="profile-card h-100">
        <div class="profile-header p-4 text-center position-relative">
          <div class="profile-avatar mx-auto mb-3">
            <img [src]="profile.image || 'https://i.pravatar.cc/100?img=1'" 
                 alt="Profile Image" 
                 class="profile-pic">
          </div>
          <div *ngIf="profile.ProfileId === loggedInProfileId" class="current-badge badge text-white">
            Current
          </div>
        </div>
        
        <div class="profile-body p-3">
          <h5 class="profile-name text-center mb-2">{{ profile.Name }}</h5>
          <p class="profile-dob text-center text-muted mb-0">
            <i class="bi bi-calendar3 me-1"></i>
            DOB: {{ profile.DateOfBirth }}
          </p>
        </div>
        
        <div class="profile-actions p-3 d-flex gap-2 flex-wrap mt-auto">
          <button class="btn action-btn btn-primary btn-sm flex-fill" (click)="onEditProfile(profile)">
            <i class="bi bi-pencil me-1"></i>
            Edit
          </button>
          
          <button *ngIf="profile.ProfileId != loggedInProfileId" 
                  class="btn action-btn btn-danger btn-sm flex-fill" 
                  (click)="onDeleteProfile(profile)">
            <i class="bi bi-trash me-1"></i>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
