<div class="container">
  <div class="row justify-content-center mt-4 ">
    <div class="col-12 col-xs-12 col-sm-6 col-md-4 border p-3 border p-3">
      <form (ngSubmit)="onSubmit()" #profileForm="ngForm">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" [(ngModel)]="profile.Name" name="name" required minlength="2" #name="ngModel" />
          <div *ngIf="name.invalid && (name.dirty || name.touched)" class="text-danger">
            <div *ngIf="name.errors?.['required']">Name is required.</div>
            <div *ngIf="name.errors?.['minlength']">Name must be at least 2 characters.</div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Date of Birth</label>
          <input type="date" class="form-control" [(ngModel)]="profile.DateOfBirth" name="dob" />
        </div>
        <!-- Token Field 1: LocalSession -->
        <div class="mb-3 input-group">
          <input type="text" class="form-control" [value]="localSessionToken" readonly />
          <button class="btn btn-outline-secondary" type="button" (click)="refreshToken('LocalSession')">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button class="btn btn-outline-secondary" type="button" (click)="copyToken(applicationToken)">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
        <!-- Token Field 2: SourceId -->
        <div class="mb-3 input-group">
          <input type="text" class="form-control" [value]="sourceIdToken" readonly />
          <button class="btn btn-outline-secondary" type="button" (click)="refreshToken('SourceId')">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button class="btn btn-outline-secondary" type="button" (click)="copyToken(applicationToken)">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
        <!-- Token Field 3: TargetId -->
        <div class="mb-3 input-group">
          <input type="text" class="form-control" [value]="targetIdToken" readonly />
          <button class="btn btn-outline-secondary" type="button" (click)="refreshToken('TargetId')">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button class="btn btn-outline-secondary" type="button" (click)="copyToken(applicationToken)">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
        <!-- Token Field 4: ApplicationToken (no refresh) -->
        <div class="mb-3 input-group">
          <input type="text" class="form-control" [value]="applicationToken" readonly />
          <button class="btn btn-outline-secondary" type="button" (click)="copyToken(applicationToken)">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
        <div class="text-end">
          <button type="submit" class="btn btn-success me-2" [disabled]="profileForm.invalid">{{ isEdit ? 'Update' :
            'Add'
            }}</button>
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
